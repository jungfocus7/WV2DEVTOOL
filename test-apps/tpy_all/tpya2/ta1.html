<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ta1</title>
<style>
  :root {
    --vmg: 5px;
    --vmg2: 10px;
  }

  body {
    margin: 0px; padding: 0px;
    background-color: black;
    font-size: 0px;
  }

  div.c_root {
    position: absolute; display: block;
    width: calc(100% - var(--vmg2));
    height: calc(100% - var(--vmg2));
    margin: var(--vmg); padding: 20px;
    background-color: dimgray;
    box-sizing: border-box;
    border-radius: 7px;
  }

  canvas.c_cvs {
    background-color: darkblue;
    width: 400px; height: 300px;
  }
</style>
</head>

<body>
  <div class="c_root">
    <canvas class="c_cvs"></canvas>
  </div>

  <script type="module" src="./ta1.js"></script>
</body>

</html>
